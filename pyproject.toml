[project]
name = "youai"
version = "0.1.0"
description = "Turn Reddit stories into short-form videos through replaceable providers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=2.53,<3.0",
    "requests>=2.34.2,<3.0",
    "selenium>=4.31,<5.0",
    "seleniumbase>=4.51.11,<5.0",
]

[project.scripts]
youai = "youai.cli:main"

[tool.poetry]
packages = [{ include = "youai" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0"
ruff = ">=0.16.2,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:rerunfailures"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
